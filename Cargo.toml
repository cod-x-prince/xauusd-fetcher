[package]
name    = "xauusd-fetcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "xauusd-fetcher"
path = "src/main.rs"

# ── Release profile: maximum performance ──────────────────────────────────────
[profile.release]
opt-level     = 3       # Full optimisation
lto           = true    # Link-Time Optimisation (cross-crate inlining)
codegen-units = 1       # Single unit → better inlining
panic         = "abort" # No unwinding overhead
strip         = true    # Strip debug symbols from binary

[dependencies]
# Async runtime
tokio             = { version = "1",    features = ["full"] }

# WebSocket (native-tls = OS TLS, no extra install needed)
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tungstenite       = { version = "0.21", features = ["native-tls"] }

# TLS stream access (needed to call .get_ref() for TCP_NODELAY)
tokio-native-tls  = "0.3"

# Async stream combinators (StreamExt / SinkExt)
futures-util      = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Serialisation
serde             = { version = "1",   features = ["derive"] }
serde_json        = "1"

# Error handling
anyhow            = "1"

# CLI argument parsing
clap              = { version = "4",   features = ["derive", "env"] }

# Logging / tracing
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono            = { version = "0.4", features = ["serde"] }

# Exponential backoff (async-aware)
backoff           = { version = "0.4", features = ["tokio"] }

# Lazy static / shared state
once_cell         = "1"

# .env file loading
dotenvy           = "0.15"
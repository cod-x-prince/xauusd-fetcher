[package]
name    = "xauusd-fetcher"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "xauusd-fetcher"
path = "src/main.rs"

# ── Release profile: maximum performance ──────────────────────────────────────
[profile.release]
opt-level     = 3       # Full optimisation
lto           = true    # Link-Time Optimisation (cross-crate inlining)
codegen-units = 1       # Single unit → better inlining
panic         = "abort" # No unwinding overhead
strip         = true    # Strip debug symbols from binary

[dependencies]
# Async runtime — current_thread scheduler = zero cross-thread migration
tokio             = { version = "1",    features = ["full"] }

# WebSocket — native-tls uses OS SChannel (Windows), no OpenSSL dep
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tungstenite       = { version = "0.21", features = ["native-tls"] }
tokio-native-tls  = "0.3"

# Async stream combinators
futures-util      = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Serialisation — serde for structs, simd-json for hot-path parsing
serde             = { version = "1",   features = ["derive"] }
serde_json        = "1"                          # used for subscription msg only
simd-json         = { version = "0.13", features = ["runtime-detection"] } # hot path — detects SIMD at runtime, scalar fallback if unavailable

# Fast float/int formatting — replaces sprintf in output hot path
ryu  = "1"
itoa = "1"

# Error handling
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time — std::time used on hot path; chrono only for ISO formatting
chrono   = { version = "0.4", features = ["serde"] }

# Reconnection backoff
backoff = { version = "0.4", features = ["tokio"] }

# Faster mutex than std (3–5x on Windows)
parking_lot = "0.12"

# Thread-to-core pinning — eliminates scheduler migration jitter
core_affinity = "0.8"

# Lazy globals
once_cell = "1"

# .env loading
dotenvy = "0.15"

# ── Windows-only: timer resolution + process priority APIs ────────────────────
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Media",
    "Win32_System_Threading",
]}